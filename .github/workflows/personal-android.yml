name: Build personal Android preview

on:
  push:
    branches: [personal-arabic-assistant]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm exec --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile --non-interactive
      - name: Check types
        run: npm run typecheck
      - name: Check translations
        run: npm run translations:verify
      - name: Run personal startup regression test
        run: npm test -- --runInBand src/utils/Telemetry/__tests__/personal.test.ts
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Build standalone personal APK
        working-directory: android
        run: bash gradlew assembleRelease -PpersonalBuild=true --no-daemon --max-workers=2
      - name: Package preview and checksum
        run: |
          mkdir -p personal-preview
          cp android/app/build/outputs/apk/release/app-release.apk personal-preview/my-assistant-preview.apk
          cp PERSONAL_ANDROID.md personal-preview/README.md
          cd personal-preview
          sha256sum my-assistant-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: my-assistant-preview
          path: personal-preview/
          if-no-files-found: error
          retention-days: 14
